[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "search-engine"
version = "0.1.0.dev0"
description = "Independent, self-hosted search engine for one Windows laptop (server-first, read-only API)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
# Runtime dependencies are added step by step, each with an ADR in docs/DECISIONS.md.
dependencies = [
    "charset-normalizer>=3.5.2",
    "httpx>=0.28.1",
    "protego>=0.7.0",
    "psutil>=7.2.2",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pypdf>=7.1.0",
    "python-dateutil>=4.0.0",
    "selectolax>=1.0.2",
    "tldextract>=5.4.0",
    "trafilatura>=2.3.1",
]

[project.scripts]
search-engine = "search_engine.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-socket>=0.7",
    "hypothesis>=6.115",
    "coverage>=7.6",
    "ruff>=0.8",
    "mypy>=1.13",
    "bandit>=1.8",
    "pip-audit>=2.7",
    "pip-licenses>=5.0",
    "trustme>=1.2.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/search_engine"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# E/F pyflakes+pycodestyle, I imports, B bugbear, UP pyupgrade, S security, PT pytest style
select = ["E", "F", "I", "B", "UP", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "PT018", "S603"]
"spikes/**" = ["S101", "S104", "PT018", "E501", "S603"]
"scripts/run_check.py" = ["S603"]
"src/search_engine/evaluation/corpus.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests", "scripts"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["dateutil.*", "trafilatura.*", "defusedxml.*", "psutil.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "spikes"]
addopts = "-ra --strict-markers --disable-socket --allow-unix-socket"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "loopback: test may connect to 127.0.0.1 or ::1 only (fixture servers)",
    "slow: slow test, listed in the step report",
]

[tool.coverage.run]
source = ["search_engine"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
